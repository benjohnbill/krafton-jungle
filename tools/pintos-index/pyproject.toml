[project]
name = "pintos-index"
version = "0.1.0"
description = "Exact code index of the Pintos kernel from libclang, with a clangd oracle"
requires-python = ">=3.11"
dependencies = ["libclang==18.1.1"]

[project.scripts]
pintos-index = "pintos_index.build:main"
pintos-index-verify = "pintos_index.verify:main"
pintos-index-mutate = "pintos_index.mutate:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
