# Render specs. Every run re-renders all of them; nothing here is hand content.

[cards]
# Files whose functions and function-like macros get a card (fnmatch patterns).
scope = ["vm/*.c", "include/vm/*.h"]

[[view]]
name = "fault-flow"
kind = "flow"
